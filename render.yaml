services:
  - type: web
    name: ethara-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethara-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: ethara-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ethara-db
    plan: free
    databaseName: ethara_db
    user: ethara_user
