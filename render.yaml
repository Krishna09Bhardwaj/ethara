services:
  - type: web
    name: ethara-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethara-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

  - type: static
    name: ethara-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ethara-db
    plan: free
    databaseName: ethara_db
    user: ethara_user
